spring.application.name=suncare-backend
server.port=${SERVER_PORT:8080}
spring.profiles.default=local

# UTC storage and ISO-8601 serialization; Asia/Saigon is used for local display/date-window boundaries
spring.jackson.time-zone=UTC
suncare.timezone.display=Asia/Saigon

# Centralized GlobalExceptionHandler renders the deterministic ProblemDetail schema
spring.mvc.problemdetails.enabled=false

# Authoritative 58-table schema lives in database/*.sql; never generate or alter schema via Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Default profile boots without requiring a live SQL Server until T03 activates the 'local'/'db' profile
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Actuator health only (no sensitive details exposed publicly)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# CORS allowed origins for frontend
suncare.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
